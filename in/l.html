<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Pages Search - Advanced Pro</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --border-color: #30363d;
            --text-color: #c9d1d9;
            --accent-color: #58a6ff;
            --disabled-color: #484f58;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 20px;
        }

        .search-container {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .search-box {
            display: flex;
            gap: 10px;
        }

        input[type="text"], input[type="number"], input[type="date"], select {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-color);
            font-size: 0.95rem;
            outline: none;
            padding: 10px 12px;
            width: 100%;
            box-sizing: border-box;
        }

        input[type="date"]::-webkit-calendar-picker-indicator {
            filter: invert(0.8);
            cursor: pointer;
        }

        input[type="text"]:focus, input[type="number"]:focus, input[type="date"]:focus, select:focus {
            border-color: var(--accent-color);
        }

        /* BOUTON TOGGLE FILTRES */
        .toggle-filters-btn {
            background: none;
            border: none;
            color: var(--accent-color);
            font-size: 0.9rem;
            font-weight: 500;
            padding: 12px 0 0 0;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .toggle-filters-btn:hover {
            text-decoration: underline;
        }

        .toggle-icon {
            display: inline-block;
            transition: transform 0.2s ease;
        }

        .toggle-filters-btn.active .toggle-icon {
            transform: rotate(90deg);
        }

        /* PANNEAU DEPLIABLE */
        .collapsible-filters {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-out, opacity 0.2s ease-out, margin-top 0.2s ease-out;
            opacity: 0;
            margin-top: 0;
        }

        .collapsible-filters.open {
            max-height: 1200px;
            opacity: 1;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid var(--border-color);
        }

        .filters-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .filter-group.full-width {
            grid-column: 1 / -1;
        }

        .filter-group label {
            font-size: 0.8rem;
            color: #8b949e;
            font-weight: 600;
        }

        .input-group {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .input-group select {
            padding: 10px 6px;
        }

        .input-group input {
            flex: 1;
            min-width: 0;
        }

        .sub-container {
            background-color: rgba(255, 255, 255, 0.02);
            border: 1px dashed var(--border-color);
            border-radius: 6px;
            padding: 10px;
            margin-top: 5px;
        }

        /* GESTION MULTI-LANGAGES */
        .lang-tags-container {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 8px;
        }

        .lang-tag {
            background-color: #21262d;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 4px 8px;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .lang-tag .remove-tag {
            cursor: pointer;
            color: #f85149;
            font-weight: bold;
        }

        button.btn-primary {
            padding: 10px 20px;
            background-color: #238636;
            border: 1px solid rgba(240, 246, 252, 0.1);
            border-radius: 6px;
            color: #ffffff;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            white-space: nowrap;
        }

        button.btn-primary:hover:not(:disabled) {
            background-color: #2ea043;
        }

        button.btn-primary:disabled {
            background-color: var(--disabled-color);
            cursor: not-allowed;
            opacity: 0.6;
        }

        .btn-secondary {
            padding: 8px 12px;
            background-color: #21262d;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: #ffffff;
            font-size: 0.85rem;
            cursor: pointer;
            white-space: nowrap;
        }

        .btn-secondary:hover {
            background-color: #30363d;
        }

        #status {
            margin: 15px 0;
            font-size: 0.95rem;
            color: #8b949e;
        }

        .results-list {
            list-style: none;
            padding: 0;
            margin: 20px 0;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .result-item {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .result-item a {
            color: var(--accent-color);
            text-decoration: none;
            word-break: break-all;
            font-weight: 500;
        }

        .result-item a:hover {
            text-decoration: underline;
        }

        .pagination {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid var(--border-color);
        }

        .pagination-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .pagination button {
            padding: 8px 16px;
            background-color: #21262d;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: #ffffff;
            cursor: pointer;
        }

        .pagination button:hover:not(:disabled) {
            background-color: #30363d;
        }

        .pagination button:disabled {
            background-color: var(--disabled-color);
            cursor: not-allowed;
            opacity: 0.6;
        }

        .jump-box {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .jump-box input[type="number"] {
            width: 70px;
            padding: 8px 10px;
            text-align: center;
        }

        .page-info {
            font-size: 0.9rem;
            color: #8b949e;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <h1>Recherche de GitHub Pages</h1>

    <div class="search-container">
        <form id="search-form">
            <div class="search-box">
                <input type="text" id="query-input" placeholder="Ex: school, portfolio, game..." required>
                <button type="submit" id="search-btn" class="btn-primary">Chercher</button>
            </div>

            <button type="button" id="toggle-filters-btn" class="toggle-filters-btn" aria-expanded="false" aria-controls="collapsible-filters">
                <span class="toggle-icon">▶</span> Filtres avancés
            </button>

            <div id="collapsible-filters" class="collapsible-filters">
                <div class="filters-grid">
                    <div class="filter-group">
                        <label for="sort-select">Trier par</label>
                        <select id="sort-select">
                            <option value="" selected>Aucun tri (Pertinence)</option>
                            <option value="stars">Étoiles</option>
                            <option value="forks">Forks</option>
                            <option value="updated">Dernière MàJ</option>
                        </select>
                    </div>

                    <div class="filter-group">
                        <label for="order-select">Ordre</label>
                        <select id="order-select" disabled>
                            <option value="desc">Décroissant</option>
                            <option value="asc">Croissant</option>
                        </select>
                    </div>

                    <div class="filter-group">
                        <label for="per-page-select">Résultats / page</label>
                        <select id="per-page-select">
                            <option value="30">30</option>
                            <option value="50">50</option>
                            <option value="100" selected>100 (Max)</option>
                        </select>
                    </div>

                    <!-- FILTRE ÉTOILES -->
                    <div class="filter-group">
                        <label for="stars-mode-select">Filtre d'étoiles (Stars)</label>
                        <select id="stars-mode-select">
                            <option value="none" selected>Pas de filtre</option>
                            <option value="min">Minimum (>=)</option>
                            <option value="range">Intervalle (Min .. Max)</option>
                            <option value="raw">Saisie libre (ex: >10)</option>
                        </select>

                        <div id="stars-controls-container" class="sub-container hidden">
                            <div id="stars-mode-min" class="hidden">
                                <input type="number" id="stars-min-input" min="0" placeholder="Min. d'étoiles (ex: 5)">
                            </div>
                            <div id="stars-mode-range" class="input-group hidden">
                                <input type="number" id="stars-range-min" min="0" placeholder="Min">
                                <span>..</span>
                                <input type="number" id="stars-range-max" min="0" placeholder="Max">
                            </div>
                            <div id="stars-mode-raw" class="hidden">
                                <input type="text" id="stars-raw-input" placeholder="ex: >10, 5..50">
                            </div>
                        </div>
                    </div>

                    <!-- FILTRE LANGAGE MULTI-OPERATEUR -->
                    <div class="filter-group full-width">
                        <label for="lang-mode-select">Filtre Langage (Opérateurs AND / OR / NOT)</label>
                        <select id="lang-mode-select">
                            <option value="single" selected>Un seul langage (Standard)</option>
                            <option value="multi">Avancé (Combinaison multi-langages)</option>
                            <option value="raw">Saisie libre brute</option>
                        </select>

                        <div id="lang-controls-container" class="sub-container">
                            <!-- Mode Single -->
                            <div id="lang-mode-single">
                                <input type="text" id="lang-single-input" list="languages-list" placeholder="ex: go, python, typescript...">
                            </div>

                            <!-- Mode Multi / Opérateurs -->
                            <div id="lang-mode-multi" class="hidden">
                                <div class="input-group" style="margin-bottom: 8px;">
                                    <label style="font-size: 0.8rem; white-space: nowrap;">Liaison :</label>
                                    <select id="lang-operator-select" style="width: auto;">
                                        <option value="OR" selected>OU (OR - Au moins l'un des langages)</option>
                                        <option value="AND">ET (AND - Plusieurs langages requis)</option>
                                        <option value="NOT">EXCLURE (NOT - Exclure ces langages)</option>
                                    </select>
                                </div>
                                <div class="input-group">
                                    <input type="text" id="lang-multi-input" list="languages-list" placeholder="Ajouter un langage...">
                                    <button type="button" id="add-lang-btn" class="btn-secondary">Ajouter</button>
                                </div>
                                <div id="lang-tags-list" class="lang-tags-container"></div>
                            </div>

                            <!-- Mode Raw -->
                            <div id="lang-mode-raw" class="hidden">
                                <input type="text" id="pushed-lang-raw" placeholder="ex: language:go OR language:python NOT language:html">
                            </div>

                            <datalist id="languages-list">
                                <option value="">-- Tous les langages --</option>
                                <option value="go">
                                <option value="python">
                                <option value="javascript">
                                <option value="typescript">
                                <option value="php">
                                <option value="html">
                                <option value="css">
                                <option value="rust">
                                <option value="c">
                                <option value="cpp">
                                <option value="csharp">
                                <option value="java">
                                <option value="shell">
                                <option value="ruby">
                                <option value="dart">
                                <option value="zig">
                            </datalist>
                        </div>
                    </div>

                    <!-- FILTRE DATE -->
                    <div class="filter-group full-width">
                        <label for="pushed-mode-select">Filtre de date (Dernier push)</label>
                        <select id="pushed-mode-select">
                            <option value="none" selected>Aucun filtre de date</option>
                            <option value="single">Date précise & Opérateur</option>
                            <option value="range">Intervalle personnalisé (Du ... Au ...)</option>
                            <option value="relative">Raccourcis temporels (ex: 7 derniers jours)</option>
                            <option value="raw">Saisie libre brute (Syntaxe GitHub native)</option>
                        </select>

                        <div id="date-controls-container" class="sub-container hidden">
                            <div id="mode-single" class="input-group hidden">
                                <select id="pushed-op-select">
                                    <option value=">=" selected>&gt;= (À partir de)</option>
                                    <option value=">">&gt; (Strictement après)</option>
                                    <option value="<=">&lt;= (Jusqu'à)</option>
                                    <option value="<">&lt; (Strictement avant)</option>
                                    <option value="=">= (Exactement ce jour)</option>
                                </select>
                                <input type="date" id="pushed-date-input">
                            </div>

                            <div id="mode-range" class="input-group hidden">
                                <select id="pushed-start-op">
                                    <option value=">=" selected>&gt;=</option>
                                    <option value=">">&gt;</option>
                                </select>
                                <input type="date" id="pushed-start-date" placeholder="Début">
                                <select id="pushed-end-op">
                                    <option value="<=" selected>&lt;=</option>
                                    <option value="<">&lt;</option>
                                </select>
                                <input type="date" id="pushed-end-date" placeholder="Fin">
                            </div>

                            <div id="mode-relative" class="hidden">
                                <select id="pushed-relative-select">
                                    <option value="7d">Les 7 derniers jours</option>
                                    <option value="30d" selected>Les 30 derniers jours</option>
                                    <option value="90d">Les 3 derniers mois</option>
                                    <option value="1y">La dernière année</option>
                                    <option value="this-year">Depuis le début de cette année</option>
                                </select>
                            </div>

                            <div id="mode-raw" class="hidden">
                                <input type="text" id="pushed-raw-input" placeholder="ex: 2024-01-01..2024-06-30 ou >=2024-01-01">
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </form>
    </div>

    <div id="status"></div>

    <ul class="results-list" id="results"></ul>

    <div class="pagination hidden" id="pagination">
        <div class="pagination-controls">
            <button id="prev-btn">« Précédent</button>
            <button id="next-btn">Suivant »</button>
        </div>

        <form class="jump-box" id="jump-form">
            <span class="page-info">Page</span>
            <input type="number" id="page-input" min="1" value="1" required>
            <span class="page-info" id="max-page-info">sur 1</span>
            <button type="submit" id="jump-btn" class="btn-primary">Aller</button>
        </form>
    </div>

    <script>
    const API_BASE_URL = 'https://in-long-aurora-7849.fly.dev/api/search';

let currentQuery = '';
let currentPage = 1;
let maxPages = 1;

// Éléments du DOM principaux
const form = document.getElementById('search-form');
const input = document.getElementById('query-input');
const searchBtn = document.getElementById('search-btn');
const statusDiv = document.getElementById('status');
const resultsUl = document.getElementById('results');

// Toggle Filtres
const toggleFiltersBtn = document.getElementById('toggle-filters-btn');
const collapsibleFilters = document.getElementById('collapsible-filters');

toggleFiltersBtn.addEventListener('click', () => {
    const isOpen = collapsibleFilters.classList.toggle('open');
    toggleFiltersBtn.classList.toggle('active', isOpen);
    toggleFiltersBtn.setAttribute('aria-expanded', isOpen);
});

const sortSelect = document.getElementById('sort-select');
const orderSelect = document.getElementById('order-select');
const perPageSelect = document.getElementById('per-page-select');

// LOGIQUE DES LANGAGES (SINGLE, MULTI AND/OR/NOT, RAW)
const langModeSelect = document.getElementById('lang-mode-select');
const langModeSingle = document.getElementById('lang-mode-single');
const langModeMulti = document.getElementById('lang-mode-multi');
const langModeRaw = document.getElementById('lang-mode-raw');

const langSingleInput = document.getElementById('lang-single-input');
const langOperatorSelect = document.getElementById('lang-operator-select');
const langMultiInput = document.getElementById('lang-multi-input');
const addLangBtn = document.getElementById('add-lang-btn');
const langTagsList = document.getElementById('lang-tags-list');
const pushedLangRaw = document.getElementById('pushed-lang-raw');

let selectedLanguages = [];

langModeSelect.addEventListener('change', () => {
    const mode = langModeSelect.value;
    langModeSingle.classList.toggle('hidden', mode !== 'single');
    langModeMulti.classList.toggle('hidden', mode !== 'multi');
    langModeRaw.classList.toggle('hidden', mode !== 'raw');
});

addLangBtn.addEventListener('click', addLanguageTag);
langMultiInput.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') {
        e.preventDefault();
        addLanguageTag();
    }
});

function addLanguageTag() {
    const val = langMultiInput.value.trim().toLowerCase();
    if (val && !selectedLanguages.includes(val)) {
        selectedLanguages.push(val);
        renderLangTags();
        langMultiInput.value = '';
    }
}

function removeLanguageTag(lang) {
    selectedLanguages = selectedLanguages.filter(l => l !== lang);
    renderLangTags();
}

function renderLangTags() {
    langTagsList.innerHTML = '';
    selectedLanguages.forEach(lang => {
        const tag = document.createElement('div');
        tag.className = 'lang-tag';
        tag.innerHTML = `<span>${lang}</span><span class="remove-tag" onclick="removeLanguageTag('${lang}')">&times;</span>`;
        langTagsList.appendChild(tag);
    });
}

function processLanguageFilter() {
    const mode = langModeSelect.value;

    if (mode === 'single') {
        const val = langSingleInput.value.trim();
        return { languageParam: val || null, queryExtra: null };
    }

    if (mode === 'multi') {
        if (selectedLanguages.length === 0) return { languageParam: null, queryExtra: null };

        const op = langOperatorSelect.value;
        if (op === 'OR') {
            const expr = selectedLanguages.map(l => `language:${l}`).join(' OR ');
            return { languageParam: null, queryExtra: `(${expr})` };
        }
        if (op === 'AND') {
            const expr = selectedLanguages.map(l => `language:${l}`).join(' ');
            return { languageParam: null, queryExtra: expr };
        }
        if (op === 'NOT') {
            const expr = selectedLanguages.map(l => `-language:${l}`).join(' ');
            return { languageParam: null, queryExtra: expr };
        }
    }

    if (mode === 'raw') {
        const raw = pushedLangRaw.value.trim();
        return { languageParam: null, queryExtra: raw || null };
    }

    return { languageParam: null, queryExtra: null };
}

// LOGIQUE ÉTOILES
const starsModeSelect = document.getElementById('stars-mode-select');
const starsControlsContainer = document.getElementById('stars-controls-container');
const starsModeMin = document.getElementById('stars-mode-min');
const starsModeRange = document.getElementById('stars-mode-range');
const starsModeRaw = document.getElementById('stars-mode-raw');
const starsMinInput = document.getElementById('stars-min-input');
const starsRangeMin = document.getElementById('stars-range-min');
const starsRangeMax = document.getElementById('stars-range-max');
const starsRawInput = document.getElementById('stars-raw-input');

starsModeSelect.addEventListener('change', () => {
    const mode = starsModeSelect.value;
    if (mode === 'none') {
        starsControlsContainer.classList.add('hidden');
        return;
    }
    starsControlsContainer.classList.remove('hidden');
    starsModeMin.classList.toggle('hidden', mode !== 'min');
    starsModeRange.classList.toggle('hidden', mode !== 'range');
    starsModeRaw.classList.toggle('hidden', mode !== 'raw');
});

function buildStarsParam() {
    const mode = starsModeSelect.value;
    if (mode === 'min') {
        const min = starsMinInput.value.trim();
        return min ? `>=${min}` : null;
    }
    if (mode === 'range') {
        const min = starsRangeMin.value.trim();
        const max = starsRangeMax.value.trim();
        if (min && max) return `${min}..${max}`;
        if (min) return `>=${min}`;
        if (max) return `<=${max}`;
        return null;
    }
    if (mode === 'raw') {
        return starsRawInput.value.trim() || null;
    }
    return null;
}

// LOGIQUE DATES
const pushedModeSelect = document.getElementById('pushed-mode-select');
const dateControlsContainer = document.getElementById('date-controls-container');
const modeSingle = document.getElementById('mode-single');
const modeRange = document.getElementById('mode-range');
const modeRelative = document.getElementById('mode-relative');
const modeRaw = document.getElementById('mode-raw');

const pushedOpSelect = document.getElementById('pushed-op-select');
const pushedDateInput = document.getElementById('pushed-date-input');
const pushedStartOp = document.getElementById('pushed-start-op');
const pushedStartDate = document.getElementById('pushed-start-date');
const pushedEndOp = document.getElementById('pushed-end-op');
const pushedEndDate = document.getElementById('pushed-end-date');
const pushedRelativeSelect = document.getElementById('pushed-relative-select');
const pushedRawInput = document.getElementById('pushed-raw-input');

const paginationDiv = document.getElementById('pagination');
const prevBtn = document.getElementById('prev-btn');
const nextBtn = document.getElementById('next-btn');
const jumpForm = document.getElementById('jump-form');
const pageInput = document.getElementById('page-input');
const maxPageInfo = document.getElementById('max-page-info');
const jumpBtn = document.getElementById('jump-btn');

function updateOrderState() {
    orderSelect.disabled = (sortSelect.value === '');
}

sortSelect.addEventListener('change', updateOrderState);

pushedModeSelect.addEventListener('change', () => {
    const mode = pushedModeSelect.value;
    if (mode === 'none') {
        dateControlsContainer.classList.add('hidden');
        return;
    }
    dateControlsContainer.classList.remove('hidden');
    modeSingle.classList.toggle('hidden', mode !== 'single');
    modeRange.classList.toggle('hidden', mode !== 'range');
    modeRelative.classList.toggle('hidden', mode !== 'relative');
    modeRaw.classList.toggle('hidden', mode !== 'raw');
});

function getRelativeDate(preset) {
    const now = new Date();
    if (preset === '7d') now.setDate(now.getDate() - 7);
    else if (preset === '30d') now.setDate(now.getDate() - 30);
    else if (preset === '90d') now.setDate(now.getDate() - 90);
    else if (preset === '1y') now.setFullYear(now.getFullYear() - 1);
    else if (preset === 'this-year') return `${now.getFullYear()}-01-01`;
    
    return now.toISOString().split('T')[0];
}

function buildPushedParam() {
    const mode = pushedModeSelect.value;

    if (mode === 'single') {
        const date = pushedDateInput.value;
        return date ? `${pushedOpSelect.value}${date}` : null;
    }

    if (mode === 'range') {
        const start = pushedStartDate.value;
        const end = pushedEndDate.value;
        if (start && end) {
            if (pushedStartOp.value === '>=' && pushedEndOp.value === '<=') {
                return `${start}..${end}`;
            }
            return `${pushedStartOp.value}${start} ${pushedEndOp.value}${end}`;
        }
        if (start) return `${pushedStartOp.value}${start}`;
        if (end) return `${pushedEndOp.value}${end}`;
        return null;
    }

    if (mode === 'relative') {
        const startDate = getRelativeDate(pushedRelativeSelect.value);
        return `>=${startDate}`;
    }

    if (mode === 'raw') {
        return pushedRawInput.value.trim() || null;
    }

    return null;
}

// EVENEMENTS ET REQUÊTE HTTP
form.addEventListener('submit', (e) => {
    e.preventDefault();
    const query = input.value.trim();
    if (query) {
        currentQuery = query;
        currentPage = 1;
        fetchResults(query, 1);
    }
});

jumpForm.addEventListener('submit', (e) => {
    e.preventDefault();
    const targetPage = parseInt(pageInput.value, 10);
    if (targetPage >= 1 && targetPage <= maxPages && targetPage !== currentPage) {
        fetchResults(currentQuery, targetPage);
    }
});

async function fetchResults(query, page) {
    setLoading(true);
    statusDiv.textContent = `Vérification HTTP en cours pour la page ${page}...`;
    resultsUl.innerHTML = '';

    const params = new URLSearchParams();
    
    // Traitement du filtre de langage
    const langResult = processLanguageFilter();
    let finalQuery = query;

    if (langResult.queryExtra) {
        finalQuery += ` ${langResult.queryExtra}`;
    }

    params.append('q', finalQuery);
    params.append('page', page);
    params.append('per_page', perPageSelect.value);

    if (langResult.languageParam) {
        params.append('language', langResult.languageParam);
    }

    if (sortSelect.value) {
        params.append('sort', sortSelect.value);
        if (orderSelect.value) {
            params.append('order', orderSelect.value);
        }
    }

    const starsVal = buildStarsParam();
    if (starsVal) {
        params.append('stars', starsVal);
    }

    const pushedVal = buildPushedParam();
    if (pushedVal) {
        params.append('pushed', pushedVal);
    }

    try {
        const response = await fetch(`${API_BASE_URL}?${params.toString()}`);
        
        if (!response.ok) {
            throw new Error(`Erreur serveur : ${response.status}`);
        }

        const data = await response.json();
        currentPage = data.current_page;
        maxPages = data.total_pages;

        displayResults(data.pages_urls);
        setupPagination(data);

    } catch (err) {
        statusDiv.textContent = `Erreur : Impossible de contacter l'API (${err.message})`;
        paginationDiv.classList.add('hidden');
    } finally {
        setLoading(false);
    }
}

function displayResults(urls) {
    resultsUl.innerHTML = '';

    if (!urls || urls.length === 0) {
        statusDiv.textContent = 'Aucun domaine fonctionnel trouvé pour cette page.';
        return;
    }

    statusDiv.textContent = `${urls.length} site(s) fonctionnel(s) trouvé(s) sur cette page :`;

    urls.forEach(url => {
        const li = document.createElement('li');
        li.className = 'result-item';

        const a = document.createElement('a');
        a.href = url;
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
        a.textContent = url;

        li.appendChild(a);
        resultsUl.appendChild(li);
    });
}

function setupPagination(data) {
    if (data.total_pages <= 1 && (!data.pages_urls || data.pages_urls.length === 0)) {
        paginationDiv.classList.add('hidden');
        return;
    }

    paginationDiv.classList.remove('hidden');

    pageInput.value = data.current_page;
    pageInput.max = data.total_pages;
    maxPageInfo.textContent = `sur ${data.total_pages} (${data.total_results} dépôts au total)`;

    prevBtn.disabled = !data.prev_page;
    nextBtn.disabled = !data.next_page;

    prevBtn.onclick = () => {
        if (data.prev_page) fetchResults(currentQuery, data.prev_page);
    };

    nextBtn.onclick = () => {
        if (data.next_page) fetchResults(currentQuery, data.next_page);
    };
}

function setLoading(isLoading) {
    searchBtn.disabled = isLoading;
    input.disabled = isLoading;
    prevBtn.disabled = isLoading;
    nextBtn.disabled = isLoading;
    jumpBtn.disabled = isLoading;
    pageInput.disabled = isLoading;

    sortSelect.disabled = isLoading;
    perPageSelect.disabled = isLoading;

    langModeSelect.disabled = isLoading;
    langSingleInput.disabled = isLoading;
    langOperatorSelect.disabled = isLoading;
    langMultiInput.disabled = isLoading;
    addLangBtn.disabled = isLoading;
    pushedLangRaw.disabled = isLoading;

    starsModeSelect.disabled = isLoading;
    starsMinInput.disabled = isLoading;
    starsRangeMin.disabled = isLoading;
    starsRangeMax.disabled = isLoading;
    starsRawInput.disabled = isLoading;

    pushedModeSelect.disabled = isLoading;
    pushedOpSelect.disabled = isLoading;
    pushedDateInput.disabled = isLoading;
    pushedStartOp.disabled = isLoading;
    pushedStartDate.disabled = isLoading;
    pushedEndOp.disabled = isLoading;
    pushedEndDate.disabled = isLoading;
    pushedRelativeSelect.disabled = isLoading;
    pushedRawInput.disabled = isLoading;

    if (isLoading) {
        orderSelect.disabled = true;
        searchBtn.textContent = 'Chargement...';
    } else {
        updateOrderState();
        searchBtn.textContent = 'Chercher';
    }
}
    </script>
