version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: github-search-api:latest
    container_name: github-search-app
    restart: unless-stopped
    environment:
      - PORT=8080
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
    security_opt:
      - no-new-privileges:true
    networks:
      - app-network

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: prometheus
    restart: unless-stopped
    volumes:
      - ./metrics/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.external-url=https://217-182-206-51.sslip.io/prometheus/'
    security_opt:
      - no-new-privileges:true
    networks:
      - app-network

  nginx:
    image: nginx:1.25-alpine
    container_name: nginx-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./certbot/nginx.conf:/etc/nginx/nginx.conf:ro
      - certbot_etc:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    depends_on:
      - api
      - prometheus
    networks:
      - app-network

  certbot:
    build:
      context: ./certbot
      dockerfile: Dockerfile
    container_name: certbot
    restart: unless-stopped
    volumes:
      - certbot_etc:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  prometheus_data:
  certbot_etc:
  certbot_www: