name: Fetch 42 User Data

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Get OAuth Token via Curl
        id: get_token
        run: |
          RESPONSE=$(curl -s -X POST https://api.intra.42.fr/oauth/token \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
            -d "grant_type=client_credentials" \
            -d "client_id=${{ secrets.FT_CLIENT_ID }}" \
            -d "client_secret=${{ secrets.FT_CLIENT_SECRET }}")
          
          echo "Réponse brute : $RESPONSE"
          
          TOKEN=$(echo "$RESPONSE" | jq -r '.access_token // empty')
          
          if [ -z "$TOKEN" ] || [ "$TOKEN" == "null" ]; then
            echo "❌ Erreur récupération token. Réponse de l'API : $RESPONSE"
            exit 1
          fi
          
          echo "token=$TOKEN" >> $GITHUB_OUTPUT

      - name: Run Data Fetcher Script
        env:
          FT_TOKEN: ${{ steps.get_token.outputs.token }}
          FT_USER_LOGIN: bordenoy
        run: node scripts/fetch-42-data.js

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(42): update user_data.json and achievement images"
          file_pattern: assets/data/42/user_data.json assets/images/42/achievements/*