name: Sync 42 Data

on:
  workflow_dispatch: # Lancement manuel depuis l'onglet Actions

jobs:
  update:
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Fetch Script
        env:
          FT_CLIENT_ID: ${{ secrets.FT_CLIENT_ID }}
          FT_CLIENT_SECRET: ${{ secrets.FT_CLIENT_SECRET }}
          FT_USER_LOGIN: 'bordenoy'
        run: node scripts/fetch-42-data.js

      - name: Commit changes
        run: |
          git config --global user.name '42-Data-Bot'
          git config --global user.email 'bot@42.fr'
          
          TARGET_FILE="assets/data/42/user_data.json"
          
          if [ -f "$TARGET_FILE" ]; then
            git add "$TARGET_FILE"
            git diff --quiet && git diff --staged --quiet || (git commit -m "chore: manual sync of 42 profile data [skip ci]" && git push)
          else
            echo "Erreur : Le fichier $TARGET_FILE n'a pas été généré."
            exit 1
          fi